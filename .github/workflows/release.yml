name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex: v1.0.16-build16). Vide = tag deduit de pubspec.yaml'
        required: false
        default: ''

permissions:
  contents: write

# Deux pushes rapproches ne justifient pas deux builds complets.
# Le run en cours est annule au profit du nouveau.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.44.0'

jobs:
  release:
    name: Build APK / AAB / Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PUB_LINE=$(grep -E '^version:' pubspec.yaml | head -n1)
          PUB_NAME=$(echo "$PUB_LINE" | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          PUB_CODE=$(echo "$PUB_LINE" | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f2)

          # Google Play refuse un versionCode deja utilise : c'est le nombre
          # apres le + de pubspec.yaml qui fait autorite. Il faut l'incrementer
          # a chaque release, sinon l'upload est rejete.
          CODE="$PUB_CODE"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${PUB_NAME}-build${PUB_CODE}"
          fi
          NAME="${TAG%%+*}"

          echo "tag=${TAG}"          >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release \`${TAG}\`"
            echo ""
            echo "| champ | valeur |"
            echo "|---|---|"
            echo "| versionName | \`${NAME}\` |"
            echo "| versionCode | \`${CODE}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| auteur | \`${{ github.actor }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Google Play refuse un versionCode deja utilise. On verifie donc que le
      # numero du pubspec.yaml depasse tous ceux deja liberes, avant de spendre
      # un build complet sur un artefact que le Play Console refusera.
      - name: Guard versionCode
        run: |
          set -euo pipefail
          CODE="${{ steps.version.outputs.version_code }}"
          if ! printf '%s' "$CODE" | grep -Eq '^[0-9]+$'; then
            echo "::error::versionCode invalide '$CODE'. Ecrire 'version: x.y.z+N' dans pubspec.yaml."
            exit 1
          fi
          MAX=$(git ls-remote --tags origin 'v*-build*' \
            | sed -E 's|.*refs/tags/.*-build([0-9]+)$|\1|' \
            | grep -E '^[0-9]+$' \
            | sort -n \
            | tail -n1 || true)
          MAX="${MAX:-0}"
          if [ "$CODE" -le "$MAX" ]; then
            echo "::error::versionCode $CODE deja utilise (max publie : $MAX). Incrementer le nombre apres le + dans pubspec.yaml, puis pusher."
            exit 1
          fi
          echo "versionCode $CODE > $MAX :OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning title=Keystore manquant::ANDROID_KEYSTORE_BASE64 non defini -> APK/AAB signes avec la cle debug. L'AAB ne sera pas publiable sur Google Play."
            exit 0
          fi
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
          echo "Keystore dechiffre : alias ${{ secrets.ANDROID_KEY_ALIAS }}"

      # continue-on-error : chaque cible est construite independamment.
      # Si le build web plante, les APK et l'AAB sont quand meme publies.
      - name: Build APK universal
        continue-on-error: true
        run: flutter build apk --release
        env:
          FLUTTER_BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          FLUTTER_BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Build APKs split par ABI
        continue-on-error: true
        run: flutter build apk --release --split-per-abi
        env:
          FLUTTER_BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          FLUTTER_BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Build AAB (Google Play)
        continue-on-error: true
        run: flutter build appbundle --release
        env:
          FLUTTER_BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          FLUTTER_BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Build web
        continue-on-error: true
        run: flutter build web --release --base-href /
        env:
          FLUTTER_BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          FLUTTER_BUILD_VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Collect artifacts
        continue-on-error: true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUT="dist/$TAG"
          mkdir -p "$OUT"

          add() {
            if [ -f "$1" ]; then
              cp "$1" "$2"
              echo "  + $(basename "$2")"
            else
              echo "  - manquant : $1"
            fi
          }

          add build/app/outputs/bundle/release/app-release.aab   "$OUT/check31-$TAG.aab"
          add build/app/outputs/flutter-apk/app-release.apk      "$OUT/check31-$TAG.apk"
          add build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$OUT/check31-$TAG-arm64-v8a.apk"
          add build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$OUT/check31-$TAG-armeabi-v7a.apk"
          add build/app/outputs/flutter-apk/app-x86_64-release.apk "$OUT/check31-$TAG-x86_64.apk"

          if [ -f build/web/index.html ]; then
            (cd build/web && zip -q -r "$GITHUB_WORKSPACE/$OUT/check31-$TAG-web.zip" .)
            echo "  + check31-$TAG-web.zip"
          else
            echo "  - manquant : build/web/index.html"
          fi

          # Un artefact absent ne doit pas faire echouer l'etape, sinon
          # rien ne serait publie du tout.
          COUNT=$(find "$OUT" -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::aucun artefact produit, publication impossible"
            exit 1
          fi
          echo "$COUNT artefact(s) pret(s) a publier :"
          ls -la "$OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Check-it ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          body: |
            versionName `${{ steps.version.outputs.version_name }}` · versionCode `${{ steps.version.outputs.version_code }}`

            | fichier | usage |
            |---|---|
            | `check31-${{ steps.version.outputs.tag }}.aab` | **Google Play Console** (upload de la release) |
            | `check31-${{ steps.version.outputs.tag }}.apk` | installation directe (tous les.cpu) |
            | `check31-${{ steps.version.outputs.tag }}-arm64-v8a.apk` | telephones Android modernes |
            | `check31-${{ steps.version.outputs.tag }}-armeabi-v7a.apk` | vieux telephones 32 bits |
            | `check31-${{ steps.version.outputs.tag }}-x86_64.apk` | emulateur x86_64 |
            | `check31-${{ steps.version.outputs.tag }}-web.zip` | deploiement web (Firebase Hosting / Netlify) |

            Seuls les fichiers reellement produits sont joints. Si une cible
            ci-dessus est absente, son build a echoue : voir l'onglet Actions.
          files: |
            dist/${{ steps.version.outputs.tag }}/*.apk
            dist/${{ steps.version.outputs.tag }}/*.aab
            dist/${{ steps.version.outputs.tag }}/*.zip

      - name: Rapport final
        if: always()
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUT="dist/$TAG"
          MISSING=0
          {
            echo ""
            echo "### Artefacts"
            echo ""
            echo "| fichier | taille |"
            echo "|---|---|"
            for f in check31-$TAG.aab check31-$TAG.apk check31-$TAG-arm64-v8a.apk \
                     check31-$TAG-armeabi-v7a.apk check31-$TAG-x86_64.apk check31-$TAG-web.zip; do
              if [ -f "$OUT/$f" ]; then
                echo "| \`$f\` | $(du -h "$OUT/$f" | cut -f1) |"
              else
                echo "| \`$f\` | **absent** |"
                MISSING=$((MISSING + 1))
              fi
            done
            echo ""
            if [ "$MISSING" -eq 0 ]; then
              echo "Tous les artefacts sont publies."
            else
              echo "**$MISSING artefact(s) absent(s)** : le build correspondant a echoue, les autres ont ete publies."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MISSING" -gt 0 ]; then
            echo "::warning::$MISSING artefact(s) absent(s), les autres sont publies"
          fi